# Grand City 6 settings (loaded by Config; missing file = defaults)
[window]
width=1280
height=720
fullscreen=false

[renderer]
# backend = d3d12 | null | vulkan  (default: d3d12 on Windows, null elsewhere)
vsync=true
msaa=false
msaaSamples=4

[post]
bloom=true
tonemapping=true
vignette=true
fxaa=true
exposure=1.1

[world]
seed=42
trafficCars=20
pedestrians=48
; hour of the day a new game starts at (0-24)
startHour=10

[game]
startingMoney=0
dayLengthSeconds=600
wetRoads=false
weather=clear

[assists]
abs=true
tractionControl=true
stabilityControl=true
handbrakeKey=Space

[audio]
muted=false
volume=0.8

[debug]
overlay=false
wireframe=false
profile=true
shaderHotReload=true
luaHotReload=true
